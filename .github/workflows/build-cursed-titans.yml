
name: Build Cursed Titans FIXED

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Extract mod
        shell: bash
        run: |
          set -e
          mkdir -p build_src
          unzip -q CursedTitans_GitHub_Build_1.21.11.zip -d build_src
          test -f build_src/build.gradle

      - name: Fix GeckoLib dependency
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build_src/build.gradle")
          code = path.read_text()

          code = code.replace(
              "includeGroupAndSubgroups('com.geckolib')",
              "includeGroup('software.bernie.geckolib')"
          )

          code = code.replace(
              "com.geckolib:geckolib-neoforge",
              "software.bernie.geckolib:geckolib-neoforge"
          )

          path.write_text(code)
          print("GeckoLib dependency corrected")
          PY

      - name: Build Minecraft mod
        shell: bash
        run: |
          set -o pipefail
          gradle -p build_src clean build \
            --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CursedTitans3D
          path: build_src/build/libs/*.jar
          if-no-files-found: error

      - name: Save error log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Error-Log
          path: build.log
          if-no-files-found: ignore
          
